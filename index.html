<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Sai Sindhu & Akhil</title>

    <link
        rel="stylesheet"
        href="style.css"
    >
</head>


<body>


    <!-- =========================================
         ENVELOPE OPENING
    ========================================== -->

    <section class="opening" id="opening">

        <div class="simple-envelope" onclick="openInvite()">
    
            <div class="envelope-cover">
                <img
                    src="envelope-cover.png"
                    alt="Wedding invitation envelope"
                >
    
                <div class="envelope-seal">
                    <span>SA</span>
                </div>
            </div>
    
            <p class="open-text">
                CLICK TO OPEN
            </p>
    
        </div>
    
    </section>



    <!-- =========================================
         MAIN WEDDING INVITATION
    ========================================== -->

    <main
        id="mainInvite"
        class="main-invite"
    >


        <!-- =====================================
             HERO.HTML

             Hero
             Save The Date
             Countdown
        ====================================== -->

        <div id="heroContainer"></div>



        <!-- =====================================
             JOURNEY.HTML

             Wedding Events
             Kolam Side Borders
        ====================================== -->

        <div id="journeyContainer"></div>



        <!-- =====================================
             LOCATION.HTML

             Venue
             Map
        ====================================== -->

        <div id="locationContainer"></div>


    </main>



    <!-- =========================================
         JAVASCRIPT
    ========================================== -->

    <script src="script.js"></script>


</body>

</html>
